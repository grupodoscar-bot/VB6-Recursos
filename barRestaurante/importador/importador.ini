; ============================================================================
;  Importador de Datos Externos  -  configuracion de barRestaurante
;  Este fichero lo baja el programa de VB6-Recursos. Para cambiar algo en los
;  clientes: editarlo aqui, SUBIR LA VERSION de abajo y hacer push.
; ============================================================================

[Config]
Version=20260924b

; Tablas que se pueden importar. Se pueden anadir mas sin tocar el programa,
; siempre que la tabla tenga clave primaria de UN solo campo.
[Tablas]
Lista=Articulos,Clientes,Proveedores,Familias,Articulos por Familias,Articulos por Codigos de Barras

; ---------------------------------------------------------------------------
;  Valores que se ponen en los registros NUEVOS cuando no vienen en el fichero.
;  Solo hacen falta las EXCEPCIONES: lo que no este aqui se resuelve solo
;  (texto -> vacio, numerico -> lo que diga la BD, fecha -> nulo).
;  Comodines: @HOY  @VACIO  @NULO  @BD
; ---------------------------------------------------------------------------

[Articulos]
Fecha Alta=@HOY
Tamaño=9
Fuente=Tahoma
Color Fondo=16777215
Color Texto=0
Archivo Imagen=nofoto.jpg

[Familias]
Tamaño=9
Fuente=Tahoma
Color Fondo=16777215
Color Texto=0

; ---------------------------------------------------------------------------
;  TABLAS HIJAS: las que cuelgan de un articulo y llevan numero de linea.
;  Ese numero NO viene en el fichero (es interno), lo calcula el programa.
;    Padre      = campo que dice a que articulo pertenece la linea
;    Contador   = campo del numero de linea
;    Identifica = campo(s) que distinguen una linea de otra (coma = varios)
;  SOLO tablas de FICHEROS. Nunca documentos.
; ---------------------------------------------------------------------------

[Tabla:Articulos por Familias]
TablaPadre=Articulos
Padre=Articulo
Contador=Linea
Identifica=Familia

[Tabla:Articulos por Codigos de Barras]
TablaPadre=Articulos
Padre=Articulo
Contador=Linea
Identifica=Codigo Barras
