; ============================================================================
;  Importador de Datos Externos  -  configuracion de peluqueria
;  Este fichero lo baja el peluqueria de VB6-Recursos. Para cambiar algo en los
;  clientes: editarlo aqui, SUBIR LA VERSION de abajo y hacer push.
; ============================================================================

[Config]
Version=20260924

; Tablas que se pueden importar. Se pueden anadir mas sin tocar el peluqueria,
; siempre que la tabla tenga clave primaria de UN solo campo.
[Tablas]
Lista=Articulos,Clientes,Proveedores,Familias

; ---------------------------------------------------------------------------
;  Valores que se ponen en los registros NUEVOS cuando no vienen en el fichero.
;  Solo hacen falta las EXCEPCIONES: lo que no este aqui se resuelve solo.
;  Comodines: @HOY  @VACIO  @NULO  @BD
; ---------------------------------------------------------------------------

[Articulos]
Fecha Alta=@HOY